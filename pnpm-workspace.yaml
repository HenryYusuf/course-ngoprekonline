minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@vercel/detect-agent@1.2.5'
  - semver@6.3.1

shellEmulator: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  simple-git-hooks: true

catalogs:
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@commitlint/cli': ^21.2.3
    '@commitlint/config-conventional': ^21.2.3
    '@nuxt/test-utils': ^4.3.3
    '@vue/test-utils': ^2.5.1
    eslint: ^10.12.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    happy-dom: ^20.0.11
    knip: ^6.39.0
    nano-staged: ^1.0.2
    nitropack: ^2.13.4
    simple-git-hooks: ^2.14.0
    skills-npm: ^4.0.0
    typescript: ^5.9.3
    vitest: ^5.0.3
    vue-tsc: ^3.3.12
  frontend:
    '@unocss/eslint-plugin': ^66.10.5
    '@unocss/nuxt': ^66.10.5
    '@unocss/preset-typography': ^66.10.5
    unocss: ^66.10.5
    vue: ^3.5.43
  prod:
    '@nuxt/content': ^3.16.1
    '@nuxtjs/sitemap': ^8.6.1
    better-sqlite3: ^12.4.1
    nuxt: ^4.5.2
    nuxt-studio: ^1.7.0
